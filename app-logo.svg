<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="195" />
    </clipPath>
  </defs>

  <!-- Solid Green Background (Edge to Edge, No White Borders) -->
  <rect width="512" height="512" fill="#0ea35d" />

  <!-- Center White Circle Container -->
  <circle cx="256" cy="256" r="195" fill="#ffffff" />

  <!-- Inner Travel Vector Graphics -->
  <g clip-path="url(#circleClip)">
    
    <!-- Dashed Circular Flight Orbit -->
    <path d="M 235 90 A 155 155 0 1 1 125 330" 
          fill="none" 
          stroke="#111827" 
          stroke-width="10" 
          stroke-dasharray="14 12" 
          stroke-linecap="round" />

    <!-- Dashed Circular Arc (Upper Right Closure) -->
    <path d="M 330 115 A 155 155 0 0 1 395 240" 
          fill="none" 
          stroke="#111827" 
          stroke-width="10" 
          stroke-dasharray="14 12" 
          stroke-linecap="round" />

    <!-- Globe Base (Black Filled Circle) -->
    <circle cx="230" cy="265" r="110" fill="#111827" />

    <!-- Globe Inner Continents & Meridian Line (White Outlines / Silhouettes) -->
    <!-- Meridian curve -->
    <path d="M 230 155 C 190 200, 190 330, 230 375" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="7" 
          stroke-linecap="round" />
    
    <!-- Americas continent outline shape inside globe -->
    <path d="M 205 175 C 220 185, 235 205, 215 225 C 205 235, 195 255, 210 275 C 220 290, 230 320, 220 340" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="7" 
          stroke-linecap="round" />
          
    <!-- Secondary continent outline shape (Right side) -->
    <path d="M 270 190 C 285 200, 290 220, 305 235 C 315 245, 305 265, 320 280" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="7" 
          stroke-linecap="round" />

    <path d="M 280 230 C 265 240, 275 260, 295 265" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="6" 
          stroke-linecap="round" />

    <!-- Flying Airplane (Top-Left along orbit trajectory, angled ~38 deg) -->
    <g transform="translate(180, 145) rotate(35) scale(1.15)">
      <!-- Fuselage -->
      <path d="M 0 -38 C 4 -32, 6 -15, 6 15 L 6 35 L 2 38 L -2 38 L -6 35 L -6 15 C -6 -15, -4 -32, 0 -38 Z" fill="#111827" />
      <!-- Main Wings -->
      <path d="M 0 -5 L 34 14 L 33 22 L 5 13 L -5 13 L -33 22 L -34 14 Z" fill="#111827" />
      <!-- Tail Wing (Horizontal Stabilizer) -->
      <path d="M 0 28 L 16 38 L 14 43 L 0 38 L -14 43 L -16 38 Z" fill="#111827" />
      <!-- Left Wing Accent Line -->
      <path d="M 0 -12 L 0 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Executive Travel Suitcase / Briefcase (Bottom-Right Foreground) -->
    <g transform="translate(295, 290)">
      <!-- Drop Shadow for Briefcase -->
      <rect x="-6" y="-6" width="140" height="110" rx="16" fill="rgba(0,0,0,0.12)" />
      
      <!-- Suitcase Handle Top -->
      <path d="M 45 0 L 45 -14 C 45 -22, 85 -22, 85 -14 L 85 0" 
            fill="none" 
            stroke="#111827" 
            stroke-width="9" 
            stroke-linecap="round" />

      <!-- Suitcase Main Body Base -->
      <rect x="0" y="0" width="128" height="98" rx="14" fill="#111827" />

      <!-- Top Flap Lid -->
      <path d="M 0 14 C 0 6, 6 0, 14 0 L 114 0 C 122 0, 128 6, 128 14 L 128 42 C 128 48, 122 52, 114 52 L 14 52 C 6 52, 0 48, 0 42 Z" fill="#1f2937" />

      <!-- Flap Edge White Line -->
      <path d="M 2 44 L 126 44" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

      <!-- Metallic Center Buckle Latch -->
      <rect x="48" y="34" width="32" height="24" rx="6" fill="#111827" stroke="#ffffff" stroke-width="4" />
      <rect x="58" y="42" width="12" height="8" rx="2" fill="#ffffff" />

      <!-- Subtle Body Vertical Accents -->
      <line x1="28" y1="52" x2="28" y2="90" stroke="#374151" stroke-width="3" stroke-dasharray="4 4" />
      <line x1="100" y1="52" x2="100" y2="90" stroke="#374151" stroke-width="3" stroke-dasharray="4 4" />
    </g>

  </g>
</svg>
