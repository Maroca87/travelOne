<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Clipping and Drop Shadow -->
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="205" />
    </clipPath>
  </defs>

  <!-- Solid Emerald Green Edge-to-Edge Background (No White Borders, Compatible with iOS Dark Mode) -->
  <rect width="512" height="512" fill="#0ea35d" />

  <!-- Crisp White Central Circle Container -->
  <circle cx="256" cy="256" r="205" fill="#ffffff" />

  <!-- Travel Silhouette Vector Graphics -->
  <g clip-path="url(#circleClip)">
    
    <!-- Dynamic Dashed Orbital Flight Path -->
    <path d="M 120 310 C 90 220, 160 110, 290 95 C 380 85, 425 150, 420 220 C 415 290, 340 395, 230 405 C 150 412, 105 350, 115 285" 
          fill="none" 
          stroke="#111827" 
          stroke-width="9" 
          stroke-dasharray="14 12" 
          stroke-linecap="round" />

    <!-- Stylized World Globe (Solid Black Circle) -->
    <circle cx="236" cy="268" r="102" fill="#111827" />

    <!-- Globe Inner Coordinates (Fine White Grid & Continent Contours) -->
    <!-- Prime Meridian & Curvature Lines -->
    <path d="M 236 166 C 196 205, 196 331, 236 370" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5.5" 
          stroke-linecap="round" />

    <path d="M 236 166 C 276 205, 276 331, 236 370" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5.5" 
          stroke-linecap="round" />

    <!-- Equator Line -->
    <path d="M 134 268 C 170 286, 302 286, 338 268" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Latitude Upper Curve -->
    <path d="M 158 215 C 190 230, 282 230, 314 215" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Latitude Lower Curve -->
    <path d="M 158 321 C 190 306, 282 306, 314 321" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Modern Ascending Commercial Jet Airplane (Soaring at 42-degree angle) -->
    <g transform="translate(290, 138) rotate(42)">
      <!-- Jet Fuselage -->
      <path d="M 0 -52 C 5 -42, 7 -20, 7 24 L 7 48 L 2 52 L -2 52 L -7 48 L -7 24 C -7 -20, -5 -42, 0 -52 Z" fill="#111827" />
      <!-- Swept Wings -->
      <path d="M 0 -8 L 52 18 L 50 28 L 7 15 L -7 15 L -50 28 L -52 18 Z" fill="#111827" />
      <!-- Wing Engines -->
      <rect x="18" y="10" width="6" height="15" rx="3" fill="#111827" stroke="#ffffff" stroke-width="1.5" />
      <rect x="-24" y="10" width="6" height="15" rx="3" fill="#111827" stroke="#ffffff" stroke-width="1.5" />
      <!-- Horizontal Stabilizer (Tail Wings) -->
      <path d="M 0 38 L 24 50 L 22 56 L 0 50 L -22 56 L -24 50 Z" fill="#111827" />
      <!-- Cockpit Windshield & Central Fuselage Line -->
      <path d="M -3 -36 L 0 -44 L 3 -36 Z" fill="#ffffff" />
      <line x1="0" y1="-28" x2="0" y2="40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Modern Executive Travel Suitcase / Luggage (Bottom-Right Foreground) -->
    <g transform="translate(305, 298)">
      <!-- Luggage Handle -->
      <path d="M 38 0 L 38 -14 C 38 -20, 74 -20, 74 -14 L 74 0" 
            fill="none" 
            stroke="#111827" 
            stroke-width="7.5" 
            stroke-linecap="round" />

      <!-- Suitcase Main Hard-Shell Case -->
      <rect x="0" y="0" width="112" height="88" rx="14" fill="#111827" />

      <!-- Top Compartment Lid / Flap -->
      <path d="M 0 12 C 0 5, 5 0, 12 0 L 100 0 C 107 0, 112 5, 112 12 L 112 36 C 112 42, 107 46, 100 46 L 12 46 C 5 46, 0 42, 0 36 Z" fill="#1f2937" />

      <!-- White Dividing Seam -->
      <line x1="4" y1="40" x2="108" y2="40" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

      <!-- Center Metallic Buckle -->
      <rect x="42" y="30" width="28" height="20" rx="5" fill="#111827" stroke="#ffffff" stroke-width="3" />
      <rect x="51" y="36" width="10" height="8" rx="2" fill="#ffffff" />

      <!-- Vertical Reinforcement Ribs -->
      <line x1="26" y1="48" x2="26" y2="80" stroke="#374151" stroke-width="2.5" stroke-linecap="round" />
      <line x1="86" y1="48" x2="86" y2="80" stroke="#374151" stroke-width="2.5" stroke-linecap="round" />

      <!-- Wheels Bottom -->
      <circle cx="20" cy="90" r="5" fill="#111827" />
      <circle cx="92" cy="90" r="5" fill="#111827" />
    </g>

    <!-- Navigation Sparkle / Star (Top-Left) -->
    <g transform="translate(136, 140) scale(0.9)">
      <path d="M 0 -18 Q 0 0, 18 0 Q 0 0, 0 18 Q 0 0, -18 0 Q 0 0, 0 -18 Z" fill="#111827" />
    </g>

  </g>
</svg>
